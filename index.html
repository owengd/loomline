<button class="edge-handle top" id="edgeTop" aria-label="Show the top bar"></button>
<button class="edge-handle right" id="edgeRight" aria-label="Show the tools"></button>
<button class="edge-handle bottom" id="edgeBottom" aria-label="Show the status bar"></button>
<div class="app" id="app">
  <div class="top-wrap" id="topWrap">
  <header class="topbar">
    <button class="ib" id="btnProjects" aria-label="Projects" title="Projects"><svg><use href="#i-back"/></svg></button>
    <svg class="app-mark" aria-hidden="true"><use href="#i-mark"/></svg>
    <button class="title-btn" id="btnTitle" aria-label="Project and revision">
      <span class="ptitle" id="projName">LOOMLINE</span>
      <span class="prev" id="projRev">No project open</span>
    </button>
    <div class="rb-tabs" id="rbTabs" role="tablist" aria-label="Tool tabs"></div>
    <div class="chips-bar">
      <button class="chip-btn" id="btnSheets" title="Sheets"><svg><use href="#i-hier"/></svg><span id="sheetName">ROOT</span><span class="dim">·</span><span id="sheetPage">–</span></button>
      <button class="chip-btn blue wide-only" id="chipNets" title="Nets"><svg><use href="#i-net"/></svg><span>NETS</span><span id="netCount">0</span></button>
      <button class="chip-btn wide-only" id="chipParts" title="Parts"><svg><use href="#i-chip"/></svg><span>PARTS</span><span id="partCount">0</span></button>
      <button class="chip-btn red" id="chipEdits" title="Unsaved edits: review and save" hidden><svg><use href="#i-save"/></svg><span>EDITS</span><span id="editCount">0</span></button>
    </div>
    <div class="top-icons">
      <button class="ib" id="btnUndo" aria-label="Undo" title="Undo" disabled><svg><use href="#i-undo"/></svg></button>
      <button class="ib wide-only" id="btnRedo" aria-label="Redo" title="Redo" disabled><svg><use href="#i-redo"/></svg></button>
      <button class="ib" id="btnBack" aria-label="Back a sheet" title="Back to the previous sheet (Alt+←)" disabled><svg><use href="#i-back"/></svg></button>
      <button class="ib" id="btnFwd" aria-label="Forward a sheet" title="Forward to the next sheet (Alt+→)" disabled><svg><use href="#i-next"/></svg></button>
      <button class="ib" id="btnUp" aria-label="Leave sheet" title="Up a sheet to the parent (Alt+Backspace)" disabled><svg><use href="#i-up"/></svg></button>
      <button class="ib" id="btnFit" aria-label="Fit sheet to screen" title="Fit sheet to screen"><svg><use href="#i-fit"/></svg></button>
      <button class="ib" id="btnLayers" aria-label="Show on drawing" title="Show on drawing: wire numbers, cross-references, checks, install status"><svg><use href="#i-layers"/></svg></button>
      <button class="ib" id="btnSearch" aria-label="Find" title="Find"><svg><use href="#i-search"/></svg></button>
      <button class="ib" id="btnFull" aria-label="Full screen" title="Full screen: bars hide; swipe in from an edge or tap a handle to show them"><svg><use href="#i-expand"/></svg></button>
      <button class="ib" id="btnSettings" aria-label="Settings" title="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
  </header>
  <div class="ribbon" id="ribbon">
    <div class="rb-tools" id="rbTools" role="toolbar"></div>
  </div>
  </div>

  <aside class="dock" id="dock" hidden aria-label="Stencils">
    <div class="dock-head"><span class="panel-title">Stencils</span><button class="ib" id="dockClose" aria-label="Close stencils"><svg><use href="#i-close"/></svg></button></div>
    <div class="dock-search"><svg><use href="#i-search"/></svg><input class="input" id="dockSearch" type="search" placeholder="Find stencils and parts" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
    <div class="dock-body" id="dockBody"></div>
    <div class="dock-foot"><span id="dockHint">Tap a stencil, then tap the drawing. Or drag it on.</span></div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="Schematic. Tap a wire to trace its net, tap a part to see its details."></canvas>
    <div class="drawbar" id="drawBar" hidden></div>
    <div class="banner" id="banner" hidden><span class="msg" id="bannerMsg"></span><span class="actions" id="bannerActions"></span></div>
    <button class="scale" id="scaleChip" title="Grid dots on or off"><span class="ruler" id="scaleRuler"></span><span id="scaleText">1.27 mm</span></button>

    <section class="welcome" id="welcome" hidden>
      <div class="inner">
        <div class="brand"><img src="icons/icon.svg" alt="" width="56" height="56"><div class="eyebrow">Loomline</div></div>
        <h1>Schematics to install, wire by wire.</h1>
        <p class="lede">Open your team's KiCad schematics straight from GitHub. Trace nets, number wires, check the design, compare revisions and log the install as it goes in.</p>
        <div class="cards">
          <button class="card" id="wConnect"><svg><use href="#i-git"/></svg><span class="ct">Connect GitHub</span><span class="cs">Latest commit loads automatically</span></button>
          <button class="card" id="wOpen"><svg><use href="#i-file"/></svg><span class="ct">Open from device</span><span class="cs">.kicad_sch files or a project ZIP</span></button>
          <button class="card" id="wSample"><svg><use href="#i-hier"/></svg><span class="ct">Open sample</span><span class="cs">KiCad complex_hierarchy demo</span></button>
        </div>
      </div>
    </section>

    <div class="loading" id="loading" hidden><div class="box"><span class="spinner"></span><span id="loadingMsg">Loading…</span></div></div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <aside class="panel" id="panel" hidden aria-label="Details">
    <div class="panel-head"><span class="panel-title" id="panelTitle">SHEETS</span><button class="ib" id="panelClose" aria-label="Close panel"><svg><use href="#i-close"/></svg></button></div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <nav class="rail" id="rail" aria-label="Tools">
    <button class="rail-btn" id="railDock" aria-pressed="false"><svg><use href="#i-stencil"/></svg><span>Stencils</span></button>
    <button class="rail-btn" data-tab="sheets"><svg><use href="#i-hier"/></svg><span>Sheets</span></button>
    <button class="rail-btn" data-tab="nets"><svg><use href="#i-net"/></svg><span>Nets</span></button>
    <button class="rail-btn wide-only" data-tab="parts"><svg><use href="#i-chip"/></svg><span>Parts</span></button>
    <button class="rail-btn wide-only" data-tab="info"><svg><use href="#i-info"/></svg><span>Properties</span></button>
    <button class="rail-btn" data-tab="check"><svg><use href="#i-alert"/></svg><span>Check</span><b class="badge" id="checkBadge" hidden>0</b></button>
    <button class="rail-btn" data-tab="install"><svg><use href="#i-install"/></svg><span>Install</span></button>
    <button class="rail-btn wide-only" data-tab="build"><svg><use href="#i-cable"/></svg><span>Looms</span></button>
    <button class="rail-btn wide-only" data-tab="reports"><svg><use href="#i-report"/></svg><span>Reports</span></button>
    <button class="rail-btn" data-tab="more"><svg><use href="#i-more"/></svg><span>More</span></button>
  </nav>

  <footer class="status" id="status">
    <button class="status-main" id="statusMain">
      <svg class="status-ico" id="statusIco"><use href="#i-hand"/></svg>
      <span class="status-text"><span class="st1" id="st1">Nothing selected</span><span class="st2" id="st2">Drag to pan, tap to select</span></span>
    </button>
    <div class="status-actions" id="statusActions"></div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer left" id="drawerProjects" hidden aria-label="Projects">
  <div class="drawer-head"><h2>PROJECTS &amp; SETTINGS</h2><button class="iconbtn" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
  <div class="drawer-body" id="projectsBody"></div>
</aside>



<div class="search" id="search" hidden role="dialog" aria-label="Search">
  <div class="search-bar">
    <input class="input" id="searchInput" type="search" placeholder="Search refs, values, nets, sheets" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="iconbtn" id="searchClose" aria-label="Close search"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="results" id="results"></div>
</div>

<input type="file" id="fileInput" multiple hidden>
